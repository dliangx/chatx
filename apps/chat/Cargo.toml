[package]
name = "chatx"
version = "0.1.0"
edition = "2024"

[dependencies]
render = {path = "../../crates/render"}
slint = {workspace = true}
chatx-core = { path = "../../crates/core" }
libp2p = { workspace = true }
sqlite = { path = "../../crates/sqlite" }
sqlx = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
qrcode = { workspace = true }
camera = { path = "../../crates/camera" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = { workspace = true }
screen = { path = "../../crates/screen" }
bridge = { path = "../../crates/bridge" }
wasmhost = { path = "../../crates/wasmhost" }
pdf = { path = "../../crates/pdf" }
audio = { path = "../../crates/audio" }
media = { path = "../../crates/media" }
cpal = "0.16"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
pinyin = "0.11"
chrono = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"

# Office document reading (Word/Excel/PowerPoint) — desktop-only. The
# `doc` crate (betteroffice) is heavy and uses Slint/Skia text/shaping
# paths that we don't want to ship in the mobile `.so` / `.a`. All mobile
# callers go through `is_mobile` short-circuits + the OS-file-manager
# reveal path, so the library never touches the `doc::` API on mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
doc = { path = "../../crates/doc" }

[build-dependencies]
slint-build = {workspace = true}
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Android + iOS render via the native (Slint) backend; the `winit_030` API is
# not used there. So `unstable-winit-030` is enabled ONLY for non-mobile
# desktop targets — on Android the selector cannot attach a renderer to the
# winit backend (its winit dep is `cfg(not(target_os="android"))`), leaving it
# renderer-less and failing to compile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.slint]
workspace = true
features = ["unstable-winit-030"]

# iOS renders via the Skia backend (winit backend forces Skia on Apple
# non-macOS targets; declared explicitly to be unambiguous).
[target.'cfg(target_os = "ios")'.dependencies.slint]
workspace = true
features = ["renderer-skia"]

# Android backend (android-activity based; provides the `slint::android`
# entry-point + a native Activity host). Target-gated so it never affects
# iOS / desktop resolution.
[target.'cfg(target_os = "android")'.dependencies.slint]
workspace = true
features = ["backend-android-activity-06"]

[lib]
name = "chatx"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]
