[package]
name = "camera"
version = "0.1.0"
edition = "2024"
description = "Cross-platform camera capture + native QR-code recognition."

[lib]
name = "camera"

[dependencies]

# Apple (macOS + iOS): shared AVFoundation-based capture + native QR decoder.
# The same objc2 bindings work on both targets; no separate deps needed.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2" }
objc2-core-foundation = { version = "0.3.2" }
objc2-core-video = { version = "0.3.2" }
objc2-core-media = { version = "0.3.2" }
objc2-av-foundation = { version = "0.3.2" }
dispatch2 = { version = "0.3", features = ["objc2"] }

# Windows + Linux: nokhwa for capture, rqrr (pure Rust) for QR decoding.
#   `input-native`    — picks the platform backend (Media Foundation / V4L2)
#   `output-threaded` — callback-style Camera (our `callback` per frame)
# default-features=false keeps the `image` codec stack (mozjpeg/avif/…) out,
# so cross-compiling needs no C toolchain for those. We read raw YUYV/GRAY
# directly, so no decoding feature is required.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = [
    "input-native",
    "output-threaded",
] }
# default-features=false turns off the `img` feature (which would pull in the
# `image` crate). We feed raw greyscale frames via `prepare_from_greyscale`.
rqrr = { version = "0.11", default-features = false }

# Android: capture already runs in the Java shell (Camera1) and reaches us
# through the `bridge` JNI consumer; we only depend on rqrr to decode the
# frames it delivers. Pure Rust, so no native library or NDK package is needed.
[target.'cfg(target_os = "android")'.dependencies]
rqrr = { version = "0.11", default-features = false }
bridge = { path = "../bridge" }
