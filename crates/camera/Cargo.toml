[package]
name = "camera"
version = "0.1.0"
edition = "2024"
description = "Cross-platform camera capture + native QR-code recognition."

[lib]
name = "camera"
path = "src/lib.rs"

# Apple (macOS + iOS): the AVFoundation shim is Swift; `build.rs` compiles
# `shim/shim.swift` into an object file and force-links it into the final
# `chatx` binary. No external Rust deps on the Apple path.

[build-dependencies]
# (none — `build.rs` shells out to `swiftc` / `clang` directly)

# Windows + Linux: nokhwa for capture.
#   `input-native`    — picks the platform backend (Media Foundation / V4L2)
#   `output-threaded` — callback-style Camera (our `callback` per frame)
# default-features=false keeps the `image` codec stack out; we read raw
# YUYV/GRAY directly, so no decoding feature is required.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = [
    "input-native",
    "output-threaded",
] }

# Shared decoder + image loading across all scan targets.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
rxing = { version = "0.9.3", default-features = false, features = [
    "decoders",
    "qrcode",
    "oned",
    "datamatrix",
    "pdf417",
    "maxicode",
    "aztec",
    "encoding_rs",
] }
# Image loading for `scan::decode_local_photo` (jpeg/png only, no C toolchain).
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }

# Android: capture runs in the Java shell and reaches us via the bridge.
[target.'cfg(target_os = "android")'.dependencies]
bridge = { path = "../bridge" }
