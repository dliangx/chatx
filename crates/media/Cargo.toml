[package]
name = "media"
version = "0.1.0"
edition = "2024"

[lib]
name = "media"
path = "src/lib.rs"

[dependencies]
webrtc_rs = { package = "webrtc", version = "0.17.2" }
openh264 = { version = "0.9", features = ["source"] }
tokio = { workspace = true }
bytes = "1"
thiserror = "2"
serde = { workspace = true }
serde_json = "1"
async-broadcast = "0.7"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
