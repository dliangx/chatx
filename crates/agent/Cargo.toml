[package]
name = "chatx-agent"
description = "Local LLM runtime for the chatx AI-assistant copilot (conversation + Llm trait + llama backend)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Pulls in `llama-cpp-2`, whose `-sys` dependency downloads + compiles
# llama.cpp (C++). Kept off by default so the workspace build stays fast and
# dependency-light; enable with `--features llama` once a .gguf model is
# available.
llama = ["dep:llama-cpp-2"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
encoding_rs = "0.8"

# Local GGUF backend — feature-gated (see `llama` above).
llama-cpp-2 = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
