# chatx-core default configuration.
#
# On first launch this file is copied to the per-profile home directory
# (e.g. `~/.config/chatx/default/config.toml` on desktop — see
# `chatx_core::config`) and THAT copy is what the app reads. Edit the user
# copy to change these values without recompiling; it overrides the values
# here (crate defaults seed it, user values win).

# Default signal (directory) server.
signal_url = "http://139.159.201.87:8080"

# Built-in AI-assistant model catalog, split by platform.
#
# Shape: `[models.<platform>]` is a nested table mapping
#   <model-name> = "<download-url>"
# The key is the model's display id AND its local file name (`<name>.gguf`).
# Keys are quoted because names contain dots (e.g. `Qwen3-1.7B`).
#
# A model is only loadable if it meets the `chatx_agent::llama` requirements:
#   * GGUF format
#   * an embedded chat template (these Qwen3 instruct checkpoints have one —
#     base models fail to load with "no chat template")
#   * an architecture llama.cpp supports (Qwen, Llama, Mistral, Gemma, …)
# Keep the mobile (ios/android) entries small (0.6B–4B); desktop uses 4B–8B.
# Quantization: `Q8_0` for the smallest (few GB) and `Q4_K_M` for the larger
# ones — a sensible size/quality tradeoff for on-device inference.

[models.desktop]
"Qwen3-4B" = "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf"
"Qwen3-8B" = "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf"

[models.ios]
"Qwen3-0.6B" = "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf"
"Qwen3-1.7B" = "https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf"
"Qwen3-4B" = "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf"

[models.android]
"Qwen3-0.6B" = "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf"
"Qwen3-1.7B" = "https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf"
"Qwen3-4B" = "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf"
