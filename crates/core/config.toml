# chatx-core default configuration.
#
# On first launch this file is copied to the per-profile home directory
# (e.g. `~/.config/chatx/default/config.toml` on desktop — see
# `chatx_core::config`) and THAT copy is what the app reads. Edit the user
# copy to change these values without recompiling; it overrides the values
# here (crate defaults seed it, user values win).

# Default signal (directory) server.
signal_url = "http://139.159.201.87:8080"

# Built-in AI-assistant model catalog, split by platform.
#
# Shape: `[models.<platform>]` is a nested table mapping
#   <model-name> = "<download-url>"
# The key is the model's display id AND its local file name (`<name>.gguf`).
# Keys are quoted because names contain dots (e.g. `Qwen2.5-3B-Instruct`).
#
# A model is only loadable if it meets the `chatx_agent::llama` requirements:
#   * GGUF format
#   * an embedded chat template (i.e. an "instruct" checkpoint — base models
#     fail to load with "no chat template")
#   * an architecture llama.cpp supports (Qwen, Llama, Mistral, Gemma, …)
# Keep the mobile (ios/android) entries small (0.5B–3B); desktop can use 3B–7B.
# `Q4_K_M` quantization is a sensible default on size/quality tradeoff.

[models.desktop]
"Qwen2.5-3B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"
"Qwen2.5-7B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/main/qwen2.5-7b-instruct-q4_k_m.gguf"

[models.ios]
"Qwen2.5-0.5B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
"Qwen2.5-1.5B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
"Qwen2.5-3B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"

[models.android]
"Qwen2.5-0.5B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
"Qwen2.5-1.5B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
"Qwen2.5-3B-Instruct" = "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"
