aes-gcm = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
ureq = { workspace = true }
tracing = { workspace = true }
crossbeam = "0.8"
parking_lot = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
