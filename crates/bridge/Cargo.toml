[package]
name = "bridge"
version = "0.1.0"
edition = "2024"
description = "Stable C-ABI bridge between the native capture shell (Swift / Kotlin) and the Rust core."

[lib]
name = "bridge"

[features]
default = []
# Enabled by the iOS build script when it successfully links the ObjC shim
# (`ChatxScreenCapture.o`) into the final binary. Leave off on hosts without
# a real iOS SDK (e.g. a bare macOS with only the stub SDK) — the bridge then
# degrades to a no-op and the Rust code still builds.
has-ios-shim = []

[dependencies]

# Android JNI wrapper. Target-gated so iOS / desktop never resolve it.
[target.'cfg(target_os = "android")'.dependencies.jni]
# 0.21 has a stable `convert_byte_array` API on JNIEnv; 0.22 split
# Env/EnvUnowned and is FFI-hostile for simple bridges.
version = "0.21"
