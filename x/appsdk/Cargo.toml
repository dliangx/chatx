[package]
name = "appsdk"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "ChatX mini-program (X) SDK: host-import bindings + canvas/text drawing primitives"

[lib]
# The SDK references host wasm imports; host-target test binaries can't link.
test = false
bench = false

[features]
# `text` — fontdue-backed single-line text (P1). Off by default so that
# plugins that only need the 5×7 bitmap font (hello) don't pull the
# rasterizer in.
text = ["dep:fontdue"]

[dependencies]
# Optional; only compiled in when a plugin enables `appsdk/text`.
fontdue = { version = "0.9", optional = true }
